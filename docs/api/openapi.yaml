                $ref: "#/components/schemas/ExternalError"
  /mcp:
    get:
      operationId: getMcpEndpoint
      tags:
        - MCP
      summary: Probe MCP endpoint authentication and protocol support.
      security:
        - bearerAuth: []
      x-commentary-feature-key: mcp.review
      responses:
        "200":
          description: Authenticated GET is accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Bearer authentication challenge with protected resource metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
    post:
      operationId: postMcpJsonRpc
      tags:
        - MCP
      summary: Call Commentary MCP over Streamable HTTP JSON-RPC.
      description: "Authenticated tools/list advertises: inbox_saved_view,
        interaction, commentary_forms, commentary_research, github_app_access,
        draft_review, review_comments, web_app_review, review_participants,
        review_polls, review_gate_status, review_document, brain_review."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpJsonRpcRequest"
      x-commentary-feature-key: mcp.review
      responses:
        "200":
          description: JSON-RPC response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "202":
          description: Accepted JSON-RPC notification.
        "400":
          description: Invalid JSON-RPC request.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Bearer authentication challenge.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: Current-protocol insufficient-scope challenge with a JSON-RPC error
            body and WWW-Authenticate metadata.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
