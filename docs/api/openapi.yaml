openapi: 3.1.0
info:
  title: Commentary Public API
  version: 0.1.0
  summary: Authenticated API and MCP surfaces for Commentary review automation.
  description: This contract documents the stable external API surface. Browser,
    internal, provider-ingress, and test routes are intentionally excluded.
  x-commentary-feature-key: api.openapi_docs
  x-commentary-api-version: v1
  x-commentary-compatibility-policy: /docs/api/versioning.md
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://commentary.dev
    description: Configured Commentary origin.
  - url: http://localhost:3000
    description: Local development.
tags:
  - name: Authentication
  - name: Tokens
  - name: GitHub
  - name: Forms
  - name: Review comments
  - name: Research Studies
  - name: Draft reviews
  - name: Web App reviews
  - name: Knowledge Brain
  - name: Webhooks
  - name: MCP
  - name: Health
  - name: OpenAPI
paths:
  /api/v1/webhook-subscriptions:
    get:
      operationId: listWebhookSubscriptions
      tags:
        - Webhooks
      summary: List workspace webhook subscriptions.
      description: Owner/admin only. Secrets are never returned by reads.
      security:
        - bearerAuth:
            - commentary.webhooks.read
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      x-commentary-feature-key: interactions.webhooks
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "403":
          description: The token or session does not have permission for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
    post:
      operationId: createWebhookSubscription
      tags:
        - Webhooks
      summary: Create a scoped webhook subscription and reveal its signing secret once.
      description: Owner/admin only. HTTPS destinations are DNS-resolved and
        SSRF-checked. Idempotency-Key makes creation retry-safe.
      security:
        - bearerAuth:
            - commentary.webhooks.write
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - endpointUrl
                - eventTypes
              additionalProperties: false
              properties:
                endpointUrl:
                  type: string
                  format: uri
                  pattern: ^https://
                eventTypes: &a2
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - interaction.created.v1
                      - interaction.updated.v1
                      - interaction.revision.created.v1
                      - interaction.decision.recorded.v1
                      - interaction.fulfillment.updated.v1
                      - interaction.terminal.v1
                      - interaction.content_purged.v1
      x-commentary-feature-key: interactions.webhooks
      responses:
        "201":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                description: The data.secret field is displayed only in this response.
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "403":
          description: The token or session does not have permission for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
  /api/v1/webhook-subscriptions/{subscriptionId}:
    get:
      operationId: getWebhookSubscription
      tags:
        - Webhooks
      summary: Get a webhook subscription without its secret.
      security:
        - bearerAuth:
            - commentary.webhooks.read
      parameters:
        - &a1
          name: subscriptionId
          in: path
          required: true
          schema:
            type: string
            pattern: ^whs_
      x-commentary-feature-key: interactions.webhooks
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "403":
          description: The token or session does not have permission for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
    patch:
      operationId: updateWebhookSubscription
      tags:
        - Webhooks
      summary: Conditionally update endpoint or event scopes.
      security:
        - bearerAuth:
            - commentary.webhooks.write
      parameters:
        - *a1
        - &a3
          name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                endpointUrl:
                  type: string
                  format: uri
                  pattern: ^https://
                eventTypes: *a2
      x-commentary-feature-key: interactions.webhooks
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "403":
          description: The token or session does not have permission for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "412":
          description: The ETag is stale.
        "428":
          description: If-Match is required.
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
  /api/v1/webhook-subscriptions/{subscriptionId}/disable:
    post:
      operationId: disableWebhookSubscription
      tags:
        - Webhooks
      summary: Disable delivery and cancel pending attempts.
      security:
        - bearerAuth:
            - commentary.webhooks.write
      parameters:
        - *a1
        - *a3
      x-commentary-feature-key: interactions.webhooks
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "403":
          description: The token or session does not have permission for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
  /api/v1/webhook-subscriptions/{subscriptionId}/rotate-secret:
    post:
      operationId: rotateWebhookSubscriptionSecret
      tags:
        - Webhooks
      summary: Rotate and reveal a new signing secret once.
      description: The prior secret stops signing new attempts immediately; later
        reads never redisplay either secret.
      security:
        - bearerAuth:
            - commentary.webhooks.write
      parameters:
        - *a1
        - *a3
      x-commentary-feature-key: interactions.webhooks
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "403":
          description: The token or session does not have permission for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
  /api/v1/webhook-subscriptions/{subscriptionId}/deliveries:
    get:
      operationId: listWebhookDeliveries
      tags:
        - Webhooks
      summary: List filtered redacted delivery diagnostics and dead letters.
      description: Returns data and nullable nextCursor for bounded older-delivery
        navigation. Response bodies are whitespace-normalized, size-bounded
        excerpts; request headers, secrets, and raw payload diagnostics are
        never returned.
      security:
        - bearerAuth:
            - commentary.webhooks.read
      parameters:
        - *a1
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      x-commentary-feature-key: interactions.webhooks
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "403":
          description: The token or session does not have permission for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
  /api/v1/webhook-subscriptions/{subscriptionId}/deliveries/{deliveryId}/replay:
    post:
      operationId: replayWebhookDelivery
      tags:
        - Webhooks
      summary: Confirm replay of one delivery as a new delivery id.
      description: Replay reports state only; it never executes or approves an action.
      security:
        - bearerAuth:
            - commentary.webhooks.write
      parameters:
        - *a1
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
            pattern: ^whd_
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - confirm
              additionalProperties: false
              properties:
                confirm:
                  const: true
      x-commentary-feature-key: interactions.webhooks
      responses:
        "202":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "403":
          description: The token or session does not have permission for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
  /.well-known/oauth-authorization-server:
    get:
      operationId: getOAuthAuthorizationServerMetadata
      tags:
        - Authentication
      summary: Get OAuth authorization server metadata.
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer:
                    type: string
                    format: uri
                  authorization_endpoint:
                    type: string
                    format: uri
                  token_endpoint:
                    type: string
                    format: uri
                  registration_endpoint:
                    type: string
                    format: uri
                  device_authorization_endpoint:
                    type: string
                    format: uri
                  scopes_supported:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExternalScope"
                additionalProperties: true
  /.well-known/oauth-protected-resource:
    get:
      operationId: getOAuthProtectedResourceMetadata
      tags:
        - Authentication
      summary: Get OAuth protected resource metadata.
      description: The canonical /mcp resource advertises the complete scope catalog,
        matching the general protected-resource and authorization-server
        metadata.
      parameters:
        - name: resource
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource:
                    type: string
                    format: uri
                  authorization_servers:
                    type: array
                    items:
                      type: string
                      format: uri
                  resource_documentation:
                    type: string
                    format: uri
                  scopes_supported:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExternalScope"
                  commentary_resources:
                    type: array
                    items:
                      type: string
                      format: uri
                  commentary_openapi:
                    type: string
                    format: uri
                additionalProperties: true
  /oauth/register:
    post:
      operationId: registerOAuthClient
      tags:
        - Authentication
      summary: Register a public OAuth client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_name:
                  type: string
                redirect_uris:
                  type: array
                  items:
                    type: string
                    format: uri
                grant_types:
                  type: array
                  items:
                    type: string
                response_types:
                  type: array
                  items:
                    type: string
                scope:
                  type: string
                token_endpoint_auth_method:
                  type: string
                  enum:
                    - none
              additionalProperties: true
      responses:
        "201":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id:
                    type: string
                  client_name:
                    type:
                      - string
                      - "null"
                  redirect_uris:
                    type: array
                    items:
                      type: string
                  token_endpoint_auth_method:
                    type: string
                    enum:
                      - none
                additionalProperties: true
        "400":
          description: OAuth request error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oauth/authorize:
    get:
      operationId: showOAuthAuthorizePage
      tags:
        - Authentication
      summary: Show the OAuth authorization page.
      description: When a client omits scope for the canonical /mcp resource, the
        signed-in user chooses read-only, review-and-comment, or a custom set at
        consent time. Omitted scope for other resources remains read-only.
      parameters:
        - name: client_id
          in: query
          required: false
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: false
          schema:
            type: string
            format: uri
        - name: response_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - code
        - name: code_challenge
          in: query
          required: false
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: false
          schema:
            type: string
            enum:
              - S256
        - name: scope
          in: query
          required: false
          schema:
            type: string
        - name: resource
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: HTML authorization page.
        "302":
          description: Redirect to the client with an authorization error.
    post:
      operationId: approveOAuthAuthorizeRequest
      tags:
        - Authentication
      summary: Approve an OAuth authorization request.
      description: Approves only the permissions displayed and selected by the user.
        Sensitive custom permissions require a separate confirmation.
      security: &a6
        - &a23
          commentarySession: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
      responses:
        "302":
          description: Redirect to the client with an authorization code or error.
  /oauth/device/code:
    post:
      operationId: createOAuthDeviceCode
      tags:
        - Authentication
      summary: Start OAuth device authorization.
      description: Scope-less requests for the canonical /mcp resource defer
        permission selection to the signed-in device consent page; other
        omitted-scope requests stay read-only.
      requestBody:
        required: true
        content:
          application/json:
            schema: &a4
              type: object
              required:
                - client_id
              properties:
                client_id:
                  type: string
                scope:
                  type: string
                target:
                  $ref: "#/components/schemas/TokenTarget"
                resource:
                  type: string
                client_name:
                  type: string
          application/x-www-form-urlencoded:
            schema: *a4
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_code:
                    type: string
                  user_code:
                    type: string
                  verification_uri:
                    type: string
                    format: uri
                  verification_uri_complete:
                    type: string
                    format: uri
                  expires_in:
                    type: integer
                  interval:
                    type: integer
        "400":
          description: OAuth request error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oauth/token:
    post:
      operationId: exchangeOAuthToken
      tags:
        - Authentication
      summary: Exchange OAuth authorization code, device code, or refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema: &a5
              type: object
              required:
                - grant_type
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                    - refresh_token
                    - urn:ietf:params:oauth:grant-type:device_code
                code:
                  type: string
                redirect_uri:
                  type: string
                  format: uri
                client_id:
                  type: string
                code_verifier:
                  type: string
                refresh_token:
                  type: string
                device_code:
                  type: string
                resource:
                  type: string
          application/x-www-form-urlencoded:
            schema: *a5
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthToken"
        "400":
          description: OAuth request error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "401":
          description: OAuth token exchange was rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /api/health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Get shallow, deep, storage, or PostgreSQL health.
      parameters:
        - name: check
          in: query
          required: false
          schema:
            type: string
            enum:
              - postgres
              - storage
              - deep
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: Health check failed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/tokens:
    get:
      operationId: listApiTokens
      tags:
        - Tokens
      summary: List API tokens for the signed-in provider connection.
      security: *a6
      x-commentary-feature-key: api.agent_access
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - tokens
                properties:
                  ok:
                    const: true
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/TokenSummary"
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "403":
          description: The token or session does not have permission for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
    post:
      operationId: createApiToken
      tags:
        - Tokens
      summary: Create an API token for scripts, MCP clients, or agents.
      description: Issuance is atomic. Retry unchanged settings with the same
        Idempotency-Key after an uncertain outcome. Replay confirms the existing
        credential without returning its one-time secret; deliberately rotate it
        in Account Developer access for recovery.
      security: *a6
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: Stable key for one issue. Omission preserves legacy non-idempotent
            requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      x-commentary-feature-key: api.agent_access
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - id
                  - grantId
                  - tokenHint
                properties:
                  ok:
                    const: true
                  id:
                    type: string
                  grantId:
                    type: string
                  replayed:
                    type: boolean
                  token:
                    type: string
                    description: One-time secret, present only for the original successful issue.
                  tokenHint:
                    type: string
        "400":
          description: The request was invalid.
          content:
