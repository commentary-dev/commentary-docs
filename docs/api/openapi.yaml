          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "403":
          description: The token or session does not have permission for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "429":
