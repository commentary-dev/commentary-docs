components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Commentary external access token
      description: Bearer token from an API token, OAuth authorization code flow,
        OAuth refresh token flow, or OAuth device flow.
    commentarySession:
      type: apiKey
      in: cookie
      name: commentary_session
      description: Signed-in Commentary browser session. Used for API token management
        routes.
  schemas:
    ExternalError:
      type: object
      required:
        - ok
        - error
      properties:
        ok:
          const: false
        error:
          type: string
      additionalProperties: true
    OAuthError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        error_description:
          type: string
      additionalProperties: true
    OAuthToken:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
    ExternalScope:
      type: string
      enum:
        - commentary.review.read
        - commentary.comments.read
        - commentary.comments.write
        - commentary.comments.status
        - commentary.draft_reviews.delete
        - commentary.draft_reviews.share
        - commentary.review.submit
        - commentary.brain.evals.read
        - commentary.brain.evals.write
    TokenTarget:
      type: string
      description: Target string such as account, github:owner/repo,
        github:owner/repo:pull:123, github:owner/repo:branch:main, or
        draft:sessionId.
    CreateTokenRequest:
      type: object
      properties:
        label:
          type: string
        scopes:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/ExternalScope"
        target:
          $ref: "#/components/schemas/TokenTarget"
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
      additionalProperties: false
    TokenSummary:
      type: object
      properties:
        id:
          type: string
        grantId:
          type: string
        tokenType:
          type: string
        tokenHint:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ExternalScope"
        resourceScope:
          type: string
          enum:
            - review
            - repo
            - account
        owner:
          type:
            - string
            - "null"
        repo:
          type:
            - string
            - "null"
        prNumber:
          type:
            - integer
            - "null"
        branchRef:
          type:
            - string
            - "null"
        draftReviewSessionId:
          type:
            - string
            - "null"
        clientName:
          type:
            - string
            - "null"
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
        lastUsedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
      additionalProperties: true
    ReviewThread:
      type: object
      properties:
        id:
          type: string
        filePath:
          type: string
        status:
          type: string
          enum:
            - open
            - resolved
        anchorStatus:
          type: string
        blockId:
          type: string
        nodeType:
          type: string
        sourceLineStart:
          type: integer
        sourceLineEnd:
          type: integer
        selectedText:
          type:
            - string
            - "null"
        prefixText:
          type:
            - string
            - "null"
        suffixText:
          type:
            - string
            - "null"
        comments:
