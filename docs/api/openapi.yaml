openapi: 3.1.0
info:
  title: Commentary Public API
  version: 0.1.0
  summary: Authenticated API and MCP surfaces for Commentary review automation.
  description: This contract documents the stable external API surface. Browser,
    internal, webhook, and test routes are intentionally excluded.
  x-commentary-feature-key: api.openapi_docs
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://commentary.dev
    description: Configured Commentary origin.
  - url: http://localhost:3000
    description: Local development.
tags:
  - name: Authentication
  - name: Tokens
  - name: Review comments
  - name: Draft reviews
  - name: Knowledge Brain
  - name: MCP
  - name: Health
  - name: OpenAPI
paths:
  /.well-known/oauth-authorization-server:
    get:
      operationId: getOAuthAuthorizationServerMetadata
      tags:
        - Authentication
      summary: Get OAuth authorization server metadata.
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer:
                    type: string
                    format: uri
                  authorization_endpoint:
                    type: string
                    format: uri
                  token_endpoint:
                    type: string
                    format: uri
                  registration_endpoint:
                    type: string
                    format: uri
                  device_authorization_endpoint:
                    type: string
                    format: uri
                  scopes_supported:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExternalScope"
                additionalProperties: true
  /.well-known/oauth-protected-resource:
    get:
      operationId: getOAuthProtectedResourceMetadata
      tags:
        - Authentication
      summary: Get OAuth protected resource metadata.
      parameters:
        - name: resource
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  resource:
                    type: string
                    format: uri
                  authorization_servers:
                    type: array
                    items:
                      type: string
                      format: uri
                  resource_documentation:
                    type: string
                    format: uri
                  scopes_supported:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExternalScope"
                  commentary_resources:
                    type: array
                    items:
                      type: string
                      format: uri
                  commentary_openapi:
                    type: string
                    format: uri
                additionalProperties: true
  /oauth/register:
    post:
      operationId: registerOAuthClient
      tags:
        - Authentication
      summary: Register a public OAuth client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_name:
                  type: string
                redirect_uris:
                  type: array
                  items:
                    type: string
                    format: uri
                grant_types:
                  type: array
                  items:
                    type: string
                response_types:
                  type: array
                  items:
                    type: string
                scope:
                  type: string
                token_endpoint_auth_method:
                  type: string
                  enum:
                    - none
              additionalProperties: true
      responses:
        "201":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id:
                    type: string
                  client_name:
                    type:
                      - string
                      - "null"
                  redirect_uris:
                    type: array
                    items:
                      type: string
                  token_endpoint_auth_method:
                    type: string
                    enum:
                      - none
                additionalProperties: true
        "400":
          description: OAuth request error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oauth/authorize:
    get:
      operationId: showOAuthAuthorizePage
      tags:
        - Authentication
      summary: Show the OAuth authorization page.
      parameters:
        - name: client_id
          in: query
          required: false
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: false
          schema:
            type: string
            format: uri
        - name: response_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - code
        - name: code_challenge
          in: query
          required: false
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: false
          schema:
            type: string
            enum:
              - S256
        - name: scope
          in: query
          required: false
          schema:
            type: string
        - name: resource
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: HTML authorization page.
        "302":
          description: Redirect to the client with an authorization error.
    post:
      operationId: approveOAuthAuthorizeRequest
      tags:
        - Authentication
      summary: Approve an OAuth authorization request.
      security: &a3
        - commentarySession: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
      responses:
        "302":
          description: Redirect to the client with an authorization code or error.
  /oauth/device/code:
    post:
      operationId: createOAuthDeviceCode
      tags:
        - Authentication
      summary: Start OAuth device authorization.
      requestBody:
        required: true
        content:
          application/json:
            schema: &a1
              type: object
              required:
                - client_id
              properties:
                client_id:
                  type: string
                scope:
                  type: string
                target:
                  $ref: "#/components/schemas/TokenTarget"
                resource:
                  type: string
                client_name:
                  type: string
          application/x-www-form-urlencoded:
            schema: *a1
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_code:
                    type: string
                  user_code:
                    type: string
                  verification_uri:
                    type: string
                    format: uri
                  verification_uri_complete:
                    type: string
                    format: uri
                  expires_in:
                    type: integer
                  interval:
                    type: integer
        "400":
          description: OAuth request error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /oauth/token:
    post:
      operationId: exchangeOAuthToken
      tags:
        - Authentication
      summary: Exchange OAuth authorization code, device code, or refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema: &a2
              type: object
              required:
                - grant_type
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                    - refresh_token
                    - urn:ietf:params:oauth:grant-type:device_code
                code:
                  type: string
                redirect_uri:
                  type: string
                  format: uri
                client_id:
                  type: string
                code_verifier:
                  type: string
                refresh_token:
                  type: string
                device_code:
                  type: string
                resource:
                  type: string
          application/x-www-form-urlencoded:
            schema: *a2
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthToken"
        "400":
          description: OAuth request error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "401":
          description: OAuth token exchange was rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
  /api/health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Get shallow, deep, storage, or PostgreSQL health.
      parameters:
        - name: check
          in: query
          required: false
          schema:
            type: string
            enum:
              - postgres
              - storage
              - deep
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: Health check failed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/tokens:
    get:
      operationId: listApiTokens
      tags:
        - Tokens
      summary: List API tokens for the signed-in provider connection.
      security: *a3
      x-commentary-feature-key: api.agent_access
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - tokens
                properties:
                  ok:
                    const: true
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/TokenSummary"
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "403":
          description: The token or session does not have permission for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
    post:
      operationId: createApiToken
      tags:
        - Tokens
      summary: Create an API token for scripts, MCP clients, or agents.
      security: *a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      x-commentary-feature-key: api.agent_access
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - id
                  - grantId
                  - token
                  - tokenHint
                properties:
                  ok:
                    const: true
                  id:
                    type: string
                  grantId:
                    type: string
                  token:
                    type: string
                  tokenHint:
                    type: string
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "403":
          description: The token or session does not have permission for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
  /api/v1/tokens/{tokenId}:
    delete:
      operationId: revokeApiToken
      tags:
        - Tokens
      summary: Revoke an API token.
      security: *a3
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
          description: API token id.
      x-commentary-feature-key: api.agent_access
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - id
                properties:
                  ok:
                    const: true
                  id:
                    type: string
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "403":
          description: The token or session does not have permission for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
  /api/v1/review/comments:
    get:
      operationId: listReviewComments
      tags:
        - Review comments
      summary: List review comments for a PR or branch document file.
      security:
        - bearerAuth:
            - commentary.comments.read
      parameters:
        - name: provider
          in: query
          required: false
          schema:
            type: string
            enum:
              - github
        - name: owner
          in: query
          required: false
          schema:
            type: string
        - name: repo
          in: query
          required: false
          schema:
            type: string
        - name: file
          in: query
          required: false
          schema:
            type: string
          description: File path.
        - name: pr
          in: query
          required: false
          schema:
            type: integer
        - name: branch
          in: query
          required: false
          schema:
            type: string
      x-commentary-feature-key: api.review.read
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  threads:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReviewThread"
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "403":
          description: The token or session does not have permission for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
    post:
      operationId: createReviewComment
      tags:
        - Review comments
      summary: Create a review comment thread on a PR or branch document.
      security:
        - bearerAuth:
            - commentary.comments.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewCommentRequest"
      x-commentary-feature-key: api.comments.write
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  thread:
                    $ref: "#/components/schemas/ReviewThread"
                  threadId:
                    type: string
                additionalProperties: true
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "403":
          description: The token or session does not have permission for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
  /api/v1/review/threads/{threadId}/comments:
    post:
      operationId: replyToReviewThread
      tags:
        - Review comments
      summary: Reply to an existing review thread.
      security:
        - bearerAuth:
            - commentary.comments.write
      parameters:
        - &a4
          name: threadId
          in: path
          required: true
          schema:
            type: string
          description: Review thread id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadReplyRequest"
      x-commentary-feature-key: api.comments.write
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  thread:
                    $ref: "#/components/schemas/ReviewThread"
                  threadId:
                    type: string
                  commentId:
                    type: string
                  status:
                    type: string
                additionalProperties: true
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "403":
          description: The token or session does not have permission for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
  /api/v1/review/threads/{threadId}/status:
    post:
      operationId: updateReviewThreadStatus
      tags:
        - Review comments
      summary: Resolve or reopen an existing review thread.
      security:
        - bearerAuth:
            - commentary.comments.status
      parameters:
        - *a4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadStatusRequest"
      x-commentary-feature-key: api.comments.write
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  thread:
                    $ref: "#/components/schemas/ReviewThread"
                  threadId:
                    type: string
                  status:
                    type: string
                additionalProperties: true
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "403":
          description: The token or session does not have permission for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
  /api/v1/draft-reviews:
    get:
      operationId: listDraftReviews
      tags:
        - Draft reviews
      summary: List draft reviews owned by the account-scoped token principal.
      security:
        - bearerAuth:
            - commentary.review.read
      x-commentary-feature-key: draft_reviews.agent_api
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  draftReviews:
                    type: array
                    items:
                      $ref: "#/components/schemas/DraftReview"
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "403":
          description: The token or session does not have permission for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
    post:
      operationId: createDraftReview
      tags:
        - Draft reviews
      summary: Create a draft review session, optionally with initial file content.
      security:
        - bearerAuth:
            - commentary.comments.write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftReviewRequest"
      x-commentary-feature-key: draft_reviews.agent_api
      responses:
        "201":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  draftReview:
                    $ref: "#/components/schemas/DraftReview"
                  sessionId:
                    type: string
                  reviewUrl:
                    type: string
                    format: uri
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "403":
          description: The token or session does not have permission for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
  /api/v1/draft-reviews/{sessionId}:
    get:
      operationId: getDraftReview
      tags:
        - Draft reviews
      summary: Get a draft review session.
      security:
        - bearerAuth:
            - commentary.review.read
      parameters:
        - &a5
          name: sessionId
          in: path
          required: true
          schema:
            type: string
          description: Draft review session id.
      x-commentary-feature-key: draft_reviews.agent_api
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  draftReview:
                    $ref: "#/components/schemas/DraftReview"
                additionalProperties: true
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "403":
          description: The token or session does not have permission for this resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "404":
          description: The resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "429":
          description: The request was rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
    patch:
      operationId: updateDraftReview
      tags:
        - Draft reviews
      summary: Update draft review metadata or Git base metadata.
      security:
        - bearerAuth:
            - commentary.comments.write
      parameters:
        - *a5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchDraftReviewRequest"
      x-commentary-feature-key: draft_reviews.agent_api
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  draftReview:
                    $ref: "#/components/schemas/DraftReview"
                additionalProperties: true
        "400":
          description: The request was invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalError"
        "401":
          description: Authentication is required.
