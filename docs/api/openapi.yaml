components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Commentary external access token
      description: Bearer token from an API token, OAuth authorization code flow,
        OAuth refresh token flow, or OAuth device flow.
    commentarySession:
      type: apiKey
      in: cookie
      name: commentary_session
      description: Signed-in Commentary browser session. Used for API token management
        routes.
  schemas:
    InteractionApiError:
      type: object
      required:
        - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
            - version
            - code
            - message
            - correlationId
          additionalProperties: false
          properties:
            version:
              const: "1"
            code:
              type: string
            message:
              type: string
            correlationId:
              type: string
            details:
              type: array
              items:
                type: object
                required:
                  - field
                  - issue
                properties:
                  field:
                    type: string
                  issue:
                    type: string
              retryable:
                type: boolean
    InteractionResource:
      type: object
      required:
        - type
        - id
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - draft_review
            - form
            - research_study
            - web_app_review
        id:
          type: string
    Interaction:
      type: object
      required:
        - id
        - resource
        - state
        - currentRevisionId
        - version
        - createdAt
        - updatedAt
      additionalProperties: true
      properties:
        id:
          type: string
          pattern: ^ixn_[A-Za-z0-9_-]{16,}$
        resource:
          $ref: "#/components/schemas/InteractionResource"
        state:
          type: string
        currentRevisionId:
          type: string
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        terminalAt:
          type:
            - string
            - "null"
          format: date-time
        revisions:
          type: array
          items:
            type: object
        messages:
          type: array
          items:
            $ref: "#/components/schemas/InteractionMessage"
    InteractionMessage:
      type: object
      required:
        - id
        - revisionId
        - actor
        - body
        - createdAt
      additionalProperties: true
      properties:
        id:
          type: string
        revisionId:
          type: string
        actor:
          type: object
        body:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        messageVersion:
          type: integer
          minimum: 1
        editedAt:
          type:
            - string
            - "null"
          format: date-time
        editable:
          type: boolean
          description: Human conversational eligibility; never grants bearer edit authority.
    InteractionGuidance:
      type: object
      required:
        - id
        - interactionId
        - revisionId
        - scope
        - body
        - deliveredAt
        - status
        - acknowledgment
      additionalProperties: false
      description: Immutable future-facing human guidance plus an optional
        content-free agent acknowledgment receipt.
      properties:
        id:
          type: string
          pattern: ^ixg_[A-Za-z0-9_-]{16,}$
        interactionId:
          type: string
        revisionId:
          type: string
        scope:
          type: string
          enum:
            - similar_items
            - same_source
            - agent_behavior
            - general
        body:
          type:
            - string
            - "null"
          maxLength: 16384
        deliveredAt:
          type: string
          format: date-time
        contentPurgedAt:
          type:
            - string
            - "null"
          format: date-time
        status:
          type: string
          enum:
            - delivered
            - acknowledged
        acknowledgment:
          oneOf:
            - type: "null"
            - type: object
              required:
                - acknowledgedAt
                - acknowledgedByAgentId
              additionalProperties: false
              properties:
                acknowledgedAt:
                  type: string
                  format: date-time
                acknowledgedByAgentId:
                  type: string
    InteractionResponseProgress:
      type:
        - object
        - "null"
      description: Browser-human recipient progress for the current exact revision.
        Does not change the Interaction lifecycle or prove external execution.
        Agent receipt transports do not expose this projection.
      properties:
        revisionId:
          type: string
        responded:
          type: boolean
        revisionChanges:
          type:
            - string
            - "null"
        previousResponses:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              id:
                type: string
              outcome:
                type: string
              value:
                type:
                  - string
                  - "null"
              contentPurged:
                type: boolean
        next:
          type: string
          enum:
            - you
            - agent
            - approvers
            - revision
            - none
        message:
          type: string
        availableActionIds:
          type: array
          items:
            type: string
        approvedActionIds:
          type: array
          description: Actions whose current approval policy is satisfied; not proof of
            execution.
          items:
            type: string
        receipts:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              actionId:
                type: string
              outcome:
                type: string
              value:
                type:
                  - string
                  - "null"
              contentPurged:
                type: boolean
    InteractionDecisionResult:
      type: object
      properties:
        decision:
          $ref: "#/components/schemas/InteractionDecision"
        aggregate:
          type:
            - object
            - "null"
        responseProgress:
          $ref: "#/components/schemas/InteractionResponseProgress"
    InteractionDecision:
      type: object
      required:
        - id
        - interactionId
        - revisionId
        - actionId
        - proposalFingerprint
        - semanticAction
        - outcome
        - actor
        - decidedAt
        - terminalState
        - execution
      additionalProperties: true
      description: Immutable human intent receipt. execution.proven is always false in
        this slice.
      properties:
        id:
          type: string
        interactionId:
          type: string
        revisionId:
          type: string
        actionId:
          type: string
        proposalFingerprint:
          type: string
          pattern: ^[a-f0-9]{64}$
        semanticAction:
          type: string
        outcome:
          type: string
          enum:
            - approve
            - reject
            - acknowledge
            - choose
            - answer
            - comment
            - request_revision
            - snooze
        actor:
          type: object
        decidedAt:
          type: string
          format: date-time
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        terminalState:
          const: recorded
        actionSnapshot:
          type:
            - object
            - "null"
        consequence:
          type:
            - object
            - "null"
        contentPurgeAfter:
          type: string
          format: date-time
        contentPurgedAt:
          type:
            - string
            - "null"
          format: date-time
        execution:
          type: object
          required:
            - proven
          properties:
            proven:
              const: false
    InteractionAgentDecisionReceipt:
      type: object
      additionalProperties: false
      required:
        - id
        - interactionId
        - revisionId
        - actionId
        - proposalFingerprint
        - semanticAction
        - outcome
        - decidedAt
        - terminalState
        - purged
      description: Privacy-safe immutable receipt for the authorized creating agent.
        Human identity, Resource data, consequence content, and action snapshots
        are omitted.
      properties:
        id:
          type: string
        interactionId:
          type: string
        revisionId:
          type: string
        actionId:
          type: string
        proposalFingerprint:
          type: string
          pattern: ^[a-f0-9]{64}$
        semanticAction:
          type: string
        outcome:
          type: string
          enum:
            - approve
            - reject
            - acknowledge
            - choose
            - answer
            - comment
            - request_revision
            - snooze
        decidedAt:
          type: string
          format: date-time
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        terminalState:
          type: string
        purged:
          type: boolean
        contentPurgedAt:
          type:
            - string
            - "null"
          format: date-time
    InteractionFulfillmentReport:
      type: object
      additionalProperties: true
      required:
        - id
        - interactionId
        - decisionId
        - revisionId
        - actionId
        - proposalFingerprint
        - status
        - reportingAgent
        - reportedAt
        - selfReported
        - verified
      description: Append-only agent self-report. selfReported is true and verified is
        false; this is not provider-success proof.
      properties:
        id:
          type: string
        interactionId:
          type: string
        decisionId:
          type: string
        revisionId:
          type: string
        actionId:
          type: string
        proposalFingerprint:
          type: string
          pattern: ^[a-f0-9]{64}$
        status:
          type: string
          enum:
            - received
            - started
            - completed
            - failed
            - unknown
        reportingAgent:
          type: object
        evidence:
          type:
            - object
            - "null"
        reportedAt:
          type: string
          format: date-time
        contentPurgeAfter:
          type:
            - string
            - "null"
          format: date-time
        contentPurgedAt:
          type:
            - string
            - "null"
          format: date-time
        selfReported:
          const: true
        verified:
          const: false
    ExternalError:
      type: object
      required:
        - ok
        - error
      properties:
        ok:
          const: false
        error:
          type: string
      additionalProperties: true
    OAuthError:
