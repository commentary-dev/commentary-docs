name: Verify docs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install MkDocs
        run: python -m pip install -r requirements.txt
      - name: Validate relative links
        run: python scripts/check-relative-links.py
      - name: Build docs strictly
        run: mkdocs build --strict
