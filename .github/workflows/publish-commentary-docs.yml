name: Publish Commentary Docs
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_release:
        description: Existing compatible release to restore; leave empty to publish this commit
        required: false
permissions:
  contents: read
concurrency:
  group: commentary-production-docs
  cancel-in-progress: false
jobs:
  publish-docs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-docs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - name: Build and verify the complete candidate
        if: ${{ !inputs.rollback_release }}
        run: npm run build && npm test
        env:
          DOCS_SOURCE_SHA: ${{ github.sha }}
          ASTRO_TELEMETRY_DISABLED: '1'
      - name: Install browser verification runtime
        if: ${{ !inputs.rollback_release }}
        run: npx playwright install --with-deps chromium
      - name: Verify the built documentation in a browser
        if: ${{ !inputs.rollback_release }}
        run: npm run test:ui
      - name: Publish immutable files and activate
        if: ${{ !inputs.rollback_release }}
        run: npm run publish:site
        env:
          COMMENTARY_APP_URL: ${{ vars.COMMENTARY_APP_URL || 'https://commentary.dev' }}
          COMMENTARY_DOCS_PUBLISH_TOKEN: ${{ secrets.COMMENTARY_DOCS_PUBLISH_TOKEN }}
      - name: Restore a previous compatible release
        if: ${{ inputs.rollback_release }}
        run: node scripts/rollback-site.mjs "$ROLLBACK_RELEASE"
        env:
          ROLLBACK_RELEASE: ${{ inputs.rollback_release }}
          COMMENTARY_APP_URL: ${{ vars.COMMENTARY_APP_URL || 'https://commentary.dev' }}
          COMMENTARY_DOCS_PUBLISH_TOKEN: ${{ secrets.COMMENTARY_DOCS_PUBLISH_TOKEN }}
